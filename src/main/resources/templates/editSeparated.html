    <h1>분반 목록</h1>

        <tr th:each="separated : ${separatedDetails}">
            <td th:text="${separated.sCode}"></td>

            </td>
        </tr>
    </table>
</main>
<script>
    const menuToggle = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('.nav-menu');
    const navRight = document.querySelector('.nav-right2');

    menuToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        if (navRight) {
            navRight.classList.toggle('active');
        }
    });
</script>

    // 분반 삭제
    function deleteSeparated(button) {
        const sCode = button.getAttribute('data-id');

        if (!confirm("정말로 삭제하시겠습니까?")) return;

        fetch(`/admin/separated/delete/${sCode}`, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    alert("✅삭제완료");
                    location.reload(); // 페이지 새로고침
                } else {
                    alert("❌삭제실패!");
                }
            })
            .catch(error => console.error("Error:", error));
    }
</script>
