<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
    <title>에러페이지</title>
    <style>
        body {
            background-color: #f5f5dc;
            color: #006400;
            font-family: Pretendard, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image:
                linear-gradient(#228b22 1px, transparent 1px),
                linear-gradient(90deg, #228b22 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: -1px -1px;
        }
        .container {
            text-align: center;
            background-color: rgba(245, 245, 220, 0.9);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 100, 0, 0.2);
            max-width: 80%;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            position: relative;
            color: #006400;
        }
        h2{
        color:black
        }
        .graph {
            width: 300px;
            height: 200px;
            margin: 20px auto;
        }
        p {
            font-size: 1.2rem;
            margin: 1rem 0;
        }
        .btn {
            display: inline-block;
            background-color: #228b22;
            color: #f5f5dc;
            padding: 0.7rem 1.5rem;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.2s;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #006400;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>404</h1>
    <svg width="300" height="200" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
        <!-- 화살표 모양 정의 -->
        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5"
                    orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#006400" />
            </marker>
        </defs>
        <!-- X축 (화살표 추가) -->
        <line x1="10" y1="90" x2="190" y2="90" stroke="#006400" stroke-width="1" marker-end="url(#arrowhead)"/>
        <!-- Y축 (화살표 추가) -->
        <line x1="10" y1="90" x2="10" y2="10" stroke="#006400" stroke-width="1" marker-end="url(#arrowhead)"/>
        <!-- X 표시 -->
        <path d="M50 30 L150 70 M50 70 L150 30" stroke="#006400" stroke-width="3"/>
    <h2>풀 수 없는 문제는 없다.</h2>
        <h2>-François Viète-</h2>
    <p>새로고침을 하거나 홈으로 돌아가 다시 시도해 보세요.</p>
    <a href="/" class="btn">홈으로</a>
    </svg>
</div>
</body>
</html>
