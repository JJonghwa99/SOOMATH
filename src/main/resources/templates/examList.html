<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>시험해설 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link href="/css/nav.css" rel="stylesheet">
    <link href="/css/List.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
<div th:replace="~{nav :: navbar}"></div>

<main>
    <div align="center">
            <h3 style="bold">시험해설 게시판</h3>
            <h6>각 학교의 시험에 대한 해설을 확인할 수 있습니다.</h6>
        <div class="board-container">
        <form action="/exam/search" class="search-form" method="get">
            <select class="search-option" name="option">
                <option value="T">제목</option>
            </select>
            <input type="text" name="keyword" class="search-input"  th:value="${keyword}" value="" required>
            <button type="submit" class="search-button"><i class="fas fa-search"></i></button>
        </form>
        <a class="btn btn-success" th:href="@{/exam/write}" sec:authorize="hasAuthority('ROLE_ADMIN')" align="center"><i class="fas fa-pen"></i>&nbsp;&nbsp;글쓰기</a>
        </div>
        <div class="table-container">
        <table class="table table-hover table-sm">
            <colgroup>
                <col style="width: 10%;"> <!-- 번호 -->
                <col style="width: 40%;"> <!-- 제목 -->
                <col style="width: 25%;"> <!-- 작성자 -->
                <col style="width: 25%;"> <!-- 작성 날짜 -->
            </colgroup>
            <thead>
            <tr style="color: white;">
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>날짜</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}"></td>
                <td style="bold"> <a style="text-decoration:none;color:black" th:href="@{'/exam/' + ${post.id}}" th:text="${post.title}">제목</a> </td>
                <td th:text="${post.writer}">
                <td th:text="${#temporals.format(post.createdDate, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
        </div>

        <!-- 페이지네이션 링크 -->
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <!-- 이전 페이지 버튼 -->
                <li th:classappend="${startPage == 1} ? 'disabled'">
                    <a class="page-link"
                       th:href="${startPage > 1} ? @{(${startPage} - 10)} : ''"
                       aria-label="Previous">
                        <span aria-hidden="true"><i class="fas fa-arrow-left"></i></span>
                    </a>
                </li>

                <!-- 페이지 번호 표시 (10개씩 범위 표시) -->
                <li th:each="pageNum : ${#numbers.sequence(startPage, endPage)}"
                    th:classappend="${pageNum == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{'/exam/page/' + ${pageNum}}"
                       th:text="${pageNum}">1</a>
                </li>

                <!-- 다음 페이지 버튼 -->
                <li th:classappend="${endPage == totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="${endPage < totalPages} ? @{(${startPage} + 10)} : ''"
                       aria-label="Next">
                        <span aria-hidden="true"><i class="fas fa-arrow-right"></i></i></span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</main>
<script>
    const menuToggle = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('.nav-menu');
    const navRight = document.querySelector('.nav-right2');

    menuToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        if (navRight) {
            navRight.classList.toggle('active');
        }
    });
</script>
</body>
</html>
