<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/43.3.1/ckeditor5.css">
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link href="/css/WriteEdit.css" rel="stylesheet">
    <title>시험해설 수정</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
</head>
<body>
<article>
    <div class="container" role="main">
        <h2>게시글 수정</h2>
        <form name="form" id="form" role="form" method="post" th:action="@{/exam/edit/{id}(id=${post.id})}" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="title">제목</label>
                <input type="text" class="form-control" name="title" id="title" th:value="${post.title}" placeholder="제목을 입력해 주세요" required>
            </div>

            <div class="mb-3">
                <label>내용</label>
                <div class="main-container" id="content">
                    <div class="editor-container editor-container_classic-editor editor-container_include-style" id="editor-container">
                        <div class="editor-container__editor">
                            <textarea id="editor" name="content" th:text="${post.content}"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <input type="hidden" name="content" id="contentHidden" />

            <div>
                <button type="submit" class="btn btn-sm btn-primary" id="btnSave"><i class="fas fa-clipboard-check"></i>&nbsp;&nbsp;저장</button>
                <a th:href="@{/exam/{id}(id=${post.id})}" class="btn btn-sm btn-secondary" id="btnBack"><i class="fas fa-window-close"></i>&nbsp;&nbsp;취소</a>
                <a th:href="@{/exam/page/1}" class="btn btn-sm btn-secondary" id="btnList"><i class="fas fa-list"></i>&nbsp;&nbsp;목록</a>
            </div>
        </form>
    </div>
</article>

<script type="importmap">
    {
        "imports": {
            "ckeditor5": "https://cdn.ckeditor.com/ckeditor5/43.3.1/ckeditor5.js",
            "ckeditor5/": "https://cdn.ckeditor.com/ckeditor5/43.3.1/"
        }
    }
</script>

<script type="module" src="/main.js"></script>
<script>
    ClassicEditor
    .create(document.querySelector('#editor'), {
        extraPlugins: [MyCustomUploadAdapterPlugin],
    })
    .then(editor => {
        document.querySelector('#form').addEventListener('submit', function () {
            document.querySelector('#contentHidden').value = editor.getData();
        });
    })
    .catch(error => {
        console.error(error);
    });
</script>
</body>
</html>
