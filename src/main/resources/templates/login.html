<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link href="/css/nav.css" rel="stylesheet">
    <link href="/css/login.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
</head>
<body>
<!-- 네비게이션 바 포함 -->
<div th:replace="~{nav :: navbar}"></div>

<main>
    <div class="background">
        <div class="info_content" style="text-align: center; margin-top: 10px;">
            <div class="login-form">
                <div class="login_logo">
                    <img src="/img/8_logo.png" style="width: 50px; height: 42px" >
                </div>
                <div class="cutstom_login_title">SOO MATH</div>
                <form onsubmit="return check_up1();" method="post" action="/login">
                    <div class="content">
                        <div class="input-group flex-nowrap">
                            <input type="text" class="form-control" name="username" id="username" placeholder="아이디">
                        </div>
                        <div class="input-group flex-nowrap" style="margin-top: 1rem;">
                            <input type="password" class="form-control" name="password" id="password" placeholder="비밀번호" onkeyup="checkCapsLock(event)">
                            <span class="input-group-text show-password" onclick="togglePassword()">🙈</span>
                        </div>
                        <div th:if="${param.error}"style="color: red; margin-top: 1rem;">
                            <h id="capslock-message">😰입력정보를 다시 확인해주세요!</h>
                        </div>
                        <div id="capslock-message" style="color: red; margin-top: 1rem;"></div>
                        <a id="forgot-password-link" class="link" onclick="openM2()">비밀번호를 잊어버리셨나요?</a>
                    </div>
                    <div class="action">
                        <button class="button-text" id="login_button" type='submit'>로그인</button>
                        <button class="button-text" id="register_button" type="button" onclick="location.href='/register';">회원가입</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        // 비밀번호 보이기/숨기기 토글 함수
function togglePassword() {
    const passwordField = document.getElementById('password');
    const toggleIcon = document.querySelector('.show-password');

    if (passwordField.type === "password") {
        passwordField.type = "text";
        toggleIcon.textContent = "🐵";
    } else {
        passwordField.type = "password";
        toggleIcon.textContent = "🙈";
    }
}

// Caps Lock 체크 함수
function checkCapsLock(event) {
    const capsLockMessage = document.getElementById('capslock-message');
    if (event.getModifierState('CapsLock')) {
        capsLockMessage.textContent = '⚠️ Caps Lock이 켜져있습니다';
    } else {
        capsLockMessage.textContent = '';
    }
}
    </script>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        const navRight = document.querySelector('.nav-right2');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            if (navRight) {
                navRight.classList.toggle('active');
            }
        });
    </script>
</main>
<!--로그인용 스크립트 없음// 공지용 게시판도 필요-->

</body>
</html>
