    <script>
        // 비밀번호 보이기/숨기기 토글 함수
    function togglePassword() {
        const passwordField = document.getElementById('password');
        const toggleIcon = document.querySelector('.show-password');

        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleIcon.textContent = "🐵";
        } else {
            passwordField.type = "password";
            toggleIcon.textContent = "🙈";
        }
    }

    // Caps Lock 체크 함수
    function checkCapsLock(event) {
        const capsLockMessage = document.getElementById('capslock-message');
        if (event.getModifierState('CapsLock')) {
            capsLockMessage.textContent = '⚠️ Caps Lock이 켜져있습니다';
        } else {
            capsLockMessage.textContent = '';
        }
    }
    </script>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        const navRight = document.querySelector('.nav-right2');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            if (navRight) {
                navRight.classList.toggle('active');
            }
        });
    </script>
    <script>
        function openM2() {
            document.getElementById('m2').style.display = 'block';
        }

        function closeM2() {
            document.getElementById('m2').style.display = 'none';
            document.getElementById('error-message1').textContent = '';
        }
    </script>
