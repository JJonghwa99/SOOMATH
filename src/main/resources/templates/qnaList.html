<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>질문 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link href="/css/nav.css" rel="stylesheet">
    <link href="/css/List.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
<!-- 네비게이션 바 포함 -->
<div th:replace="~{nav :: navbar}"></div>

<main>
    <div align="center">
        <h3 style="bold">질문 게시판</h3>
        <h6>수학문제에 대한 질문을 게시하고 답변을 확인할 수 있습니다.</h6>
    <!-- 검색 폼 -->
        <div class="board-container">
    <form action="/qna/search" method="get" class="search-form">
        <select name="option" class="search-option">
            <option value="T">제목</option>
        </select>
        <input type="text" name="keyword" class="search-input" th:value="${keyword}" required>
        <button type="submit" class="search-button"><i class="fas fa-search"></i></button>
    </form>

    <!-- 글쓰기 버튼 -->
    <a href="/qna/write" class="btn btn-success" align="center"><i class="fas fa-pen"></i> 글쓰기</a>
        </div>

    <!-- 게시판 리스트 -->
    <div class="table-container">
        <table class="table table-hover table-sm">
            <colgroup>
                <col style="width: 10%;"> <!-- 번호 -->
                <col style="width: 40%;"> <!-- 제목 -->
                <col style="width: 25%;"> <!-- 작성자 -->
                <col style="width: 25%;"> <!-- 작성 날짜 -->
            </colgroup>
            <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>날짜</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}"></td>
                <td style="font-weight: bold;">
                    <!-- 답글 여부에 따른 화살표 표시 -->
                    <span th:if="${post.depth > 0}"
                          th:style="'margin-left: ' + ${post.depth * 20} + 'px;'">↪</span>

                    <!-- 비밀글 여부 확인 -->
                    <span th:if="${post.secret and !(currentUsername == post.username or isAdmin or (post.parentId != null and currentUsername == post.parentUsername))}">
                    <i class="fas fa-lock"></i>&nbsp;&nbsp;비밀글입니다.
                    </span>

                    <!-- 비밀글이 아니거나 권한 있는 사용자인 경우 제목 표시 -->
                    <a th:unless="${post.secret and !(currentUsername == post.username or isAdmin or (post.parentId != null and currentUsername == post.parentUsername))}"
                       style="text-decoration:none; color:black;"
                       th:href="@{/qna/{id}(id=${post.id})}"
                       th:text="${post.title}">
                    </a>
                </td>
                <td th:text="${post.writer}"></td>
                <td th:text="${#temporals.format(post.createdDate, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    </div>

    <!-- 페이지네이션 링크 -->
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <!-- 이전 페이지 버튼 -->
            <li th:classappend="${startPage == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="${startPage > 1} ? @{(${startPage} - 10)} : ''"
                   aria-label="Previous">
                    <span aria-hidden="true"><i class="fas fa-arrow-left"></i></span>
                </a>
            </li>

            <!-- 페이지 번호 표시 (10개씩 범위 표시) -->
            <li th:each="pageNum : ${#numbers.sequence(startPage, endPage)}"
                th:classappend="${pageNum == currentPage} ? 'active'">
                <a class="page-link" th:href="@{'/qna/page/' + ${pageNum}}"
                   th:text="${pageNum}">1</a>
            </li>

            <!-- 다음 페이지 버튼 -->
            <li th:classappend="${endPage == totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="${endPage < totalPages} ? @{(${startPage} + 10)} : ''"
                   aria-label="Next">
                    <span aria-hidden="true"><i class="fas fa-arrow-right"></i></i></span>
                </a>
            </li>
        </ul>
    </nav>
</main>

<script>
    const menuToggle = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('.nav-menu');
    const navRight = document.querySelector('.nav-right2');

    menuToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        if (navRight) {
            navRight.classList.toggle('active');
        }
    });
</script>
</body>
</html>
