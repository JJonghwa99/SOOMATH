<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link href="/css/nav.css" rel="stylesheet">
    <link href="/css/register.css" rel="stylesheet">
</head>
<body>
<!-- 네비게이션 바 포함 -->
<div th:replace="~{nav :: navbar}"></div>

<main>
    <div class="background">
        <div class="info_content text-center">
            <div class="login-form">
                <div class="cutstom_login_title"><b>회원가입</b></div>
                <form id="register-form" method="post">
                    <div class="content">
                        <div class="box-margin1">
                            <label>아이디</label>
                            <input class="form-control" type="text" name="username" required>
                        </div>
                        <div class="box-margin1">
                            <label>이름</label>
                            <input class="form-control" type="text" name="displayName" required>
                        </div>
                        <div class="box-margin1">
                            <label>닉네임</label>
                            <input class="form-control" type="text" name="nickName" placeholder="랭킹에서 보여질 이름입니다.">
                        </div>
                        <div class="box-margin1">
                            <label>학교</label>
                            <select class="form-control" name="schoolName" required>
                                <option value="" disabled selected>학교를 선택하세요</option>
                                <option value="PreWinter">PreWinter</option>
                                <option value="흥덕고">흥덕고</option>
                                <option value="태장고">태장고</option>
                                <option value="청명고">청명고</option>
                                <option value="영덕고">영덕고</option>
                                <option value="서천고">서천고</option>
                                <option value="망포고">망포고</option>
                            </select>
                        </div>
                        <div class="box-margin1">
                            <label>학년</label>
                            <select class="form-control" name="grade" required>
                                <option value="" disabled selected>학년을 선택하세요</option>
                                <option value="0">중3학년</option>
                                <option value="1">1학년</option>
                                <option value="2">2학년</option>
                                <option value="3">3학년</option>
                            </select>
                        </div>
                        <div class="box-margin1">
                            <label>비밀번호</label>
                            <div class="input-group flex-nowrap">
                                <input class="form-control" id="pw1" type="password" name="password" placeholder="8자 이상 입력해주세요" required>
                                <span class="input-group-text show-password1" onclick="togglePassword('pw1', 'show-password1')">🙈</span>
                            </div>
                        </div>
                        <div class="box-margin1">
                            <label>비밀번호 재확인</label>
                            <div class="input-group flex-nowrap">
                                <input class="form-control" id="pw2" type="password" name="password2" required>
                                <span class="input-group-text show-password2" onclick="togglePassword('pw2', 'show-password2')">🙈</span>
                            </div>
                        </div>
                        <div id="error-message" class="text-danger mt-3"></div>
                    </div>
                    <div class="action2 mt-4">
                        <button class="button-text" id="register_button" type="submit">가입하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
            function check_up() {
                const username = document.querySelector('input[name="username"]');
                const displayName = document.querySelector('input[name="displayName"]');
                const schoolName = document.querySelector('select[name="schoolName"]');
                const grade = document.querySelector('select[name="grade"]');
                const pw1 = document.getElementById('pw1');
                const pw2 = document.getElementById('pw2');
                const pw1Value = pw1.value;
                const pw2Value = pw2.value;

                // 아이디 체크
                if (!username.value.trim()) {
                $('#error-message').text('😢 아이디를 입력해주세요.');
                username.focus();
                return false;
                }

                // 이름 체크
                if (!displayName.value.trim()) {
                $('#error-message').text('😢 이름을 입력해주세요.');
                displayName.focus();
                return false;
                }
                //닉네임 체크


                // 학교 선택 체크
                if (!schoolName.value) {
                $('#error-message').text('😢 학교를 선택해주세요.');
                schoolName.focus();
                return false;
                }

                // 학년 선택 체크
                if (!grade.value) {
                $('#error-message').text('😢 학년을 선택해주세요.');
                grade.focus();
                return false;
                }

                if (!pw1Value) {
                    $('#error-message').text('😢 비밀번호를 입력해주세요.');
                    pw1.focus();
                    return false;
                }
                if (pw1Value !== pw2Value) {
                    $('#error-message').text('😢 비밀번호가 일치하지 않습니다.');
                    pw1.focus();
                    return false;
                }
                return true;
            }

            $(document).ready(function() {
                $('#register-form').submit(function(event) {
                    event.preventDefault(); // 폼 기본 제출을 막음
                    if (check_up()) { // 비밀번호 검증 통과 시에만 AJAX 요청 실행
                        $.ajax({
                            url: '/tempMember',
                            type: 'POST',
                            data: {
                                username: $('input[name="username"]').val(),
                                displayName: $('input[name="displayName"]').val(),
                                schoolName: $('select[name="schoolName"]').val(),  // 수정됨
                                grade: $('select[name="grade"]').val(),  // 수정됨
                                password: $('#pw1').val(),
                            },
                            success: function(response) {
                                if(response === "success"){
                                    window.location.href = '/success';
                                } else if (response === "error1") {
                                    $('#error-message').text('😰이미 가입된 아이디입니다!❌');
                                } else if (response === "error2") {
                                    $('#error-message').text('😰비밀번호가 너무 짧아요.');
                                } else {
                                    $('#error-message').text('😰회원가입에 실패했어요.');
                                }
                            },
                            error: function() {
                                $('#error-message').text('😰회원가입에 실패했어요.');
                            }
                        });
                    }
                });
            });

            // 비밀번호 보이기 스크립트
            function togglePassword(inputId, iconClass) {
                const passwordField = document.getElementById(inputId);
                const passwordFieldType = passwordField.getAttribute("type");
                const toggleIcon = document.querySelector(`.${iconClass}`);

                if (passwordFieldType === "password") {
                    passwordField.setAttribute("type", "text");
                    toggleIcon.textContent = "🐵";
                } else {
                    passwordField.setAttribute("type", "password");
                    toggleIcon.textContent = "🙈";
                }
            }
    </script>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        const navRight = document.querySelector('.nav-right2');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            if (navRight) {
                navRight.classList.toggle('active');
            }
        });
    </script>
</main>
</body>
</html>
