<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학생 점수 차트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta2/css/bootstrap-select.min.css" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="/css/nav.css" rel="stylesheet">
    <link href="/css/score.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{nav :: navbar}"></div>

<main class="container mt-5">
    <div class="upload-section">
        <h3>성적 파일 업로드</h3>
        <form id="uploadForm" th:action="@{/admin/score/upload}" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".txt,.csv">
            <button class="btn btn-primary" type="submit">업로드</button>
        </form>
    </div>

    <div class="member-list mt-4">
        <h3>회원 목록</h3>
        <table class="table">
            <thead>
            <tr>
                <th>학번</th>
                <th>이름</th>
                <th>
                    <div style="display: flex; align-items: center; width: 100%;" >
                        <select id="separatedFilter" class="form-control selectpicker" multiple data-actions-box="true" onchange="filterMembers()" data-container="body" data-none-selected-text="분반필터" >
                            <option th:each="course : ${courses}"
                                    th:value="${course.sCode}"
                                    th:text="${course.sName}">
                            </option>
                        </select>
                    </div>
                </th>
                <th>
                    <select id="schoolFilter" onchange="filterMembers()">
                        <option value="">전체</option>
                        <option value="중학생">중학생</option>
                        <option value="흥덕고">흥덕고</option>
                        <option value="태장고">태장고</option>
                        <option value="청명고">청명고</option>
                        <option value="영덕고">영덕고</option>
                        <option value="서천고">서천고</option>
                        <option value="병점고">병점고</option>
                        <option value="화성고">화성고</option>
                        <option value="효원고">효원고</option>
                        <option value="유신고">유신고</option>
                        <option value="영신여고">영신여고</option>
                        <option value="화홍고">화홍고</option>
                        <option value="창현고">창현고</option>
                        <option value="수원고">수원고</option>
                        <option value="매탄고">매탄고</option>
                    </select>
                    학교
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.username}"></td>
                <td th:text="${member.displayName}" class="bold-text"></td>
                <td>
                    <select id="separated-select" class="form-control selectpicker" name="separated[]" multiple data-actions-box="true" data-container="body" disabled >
                        <!-- 동적으로 옵션 생성 -->
                        <option th:each="course : ${courses}"
                                th:value="${course.sCode}"
                                th:text="${course.sName}"
                                th:selected="${#lists.contains(member.separated, course.sCode)}">
                        </option>
                    </select>
                </td>
            <td th:text="${member.schoolName}" class="bold-text"></td>
                <td>
                    <a th:href="@{/admin/score/image(username=${member.username})}" class="btn btn-primary"><i class="fas fa-chart-line"></i></a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script>
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData(this);

        fetch('/admin/score/upload', {
            method: 'POST',
            body: formData
        })
        .then(response => response.text())
        .then(data => {
            alert(data);
            window.location.reload(); // 페이지 새로고침
        })
        .catch(error => {
            alert('파일 업로드 중 오류가 발생했습니다.');
        });
    });

</script>
<script>
    function filterMembers() {
        let schoolFilter = document.getElementById("schoolFilter").value;
        let separatedFilter = Array.from(document.getElementById("separatedFilter").selectedOptions).map(option => option.value);

        let rows = document.querySelectorAll(".member-list tbody tr");

        rows.forEach(row => {
            let schoolName = row.querySelector("td:nth-child(4)").textContent.trim();
            let separatedOptions = Array.from(row.querySelector("#separated-select").selectedOptions).map(option => option.value);

            let schoolMatch = schoolFilter === "" || schoolName === schoolFilter;
            let separatedMatch = separatedFilter.length === 0 || separatedFilter.every(code => separatedOptions.includes(code));

            if (schoolMatch && separatedMatch) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
        });
    }

    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("schoolFilter").addEventListener("change", filterMembers);
        document.getElementById("separatedFilter").addEventListener("change", filterMembers);
    });
</script>
<script>
    const menuToggle = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('.nav-menu');
    const navRight = document.querySelector('.nav-right2');

    menuToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        if (navRight) {
            navRight.classList.toggle('active');
        }
    });
</script>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap Select JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>
</body>
</html>
