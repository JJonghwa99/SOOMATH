<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학생 점수 차트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
    <link href="/css/nav.css" rel="stylesheet">
    <link href="/css/score.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{nav :: navbar}"></div>

<main class="container mt-5">
    <div class="upload-section">
        <h3>성적 파일 업로드</h3>
        <form id="uploadForm" th:action="@{/admin/score/upload}" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".txt,.csv">
            <button class="btn btn-primary" type="submit">업로드</button>
        </form>
    </div>

    <div class="member-list mt-4">
        <h3>회원 목록</h3>
        <table class="table">
            <thead>
            <tr>
                <th>학번</th>
                <th>이름</th>
                <th>
                    <select id="schoolFilter" onchange="filterMembers()">
                        <option value="">전체</option>
                        <option value="흥덕고">흥덕고</option>
                        <option value="태장고">태장고</option>
                        <option value="청명고">청명고</option>
                        <option value="영덕고">영덕고</option>
                        <option value="서천고">서천고</option>
                        <option value="망포고">망포고</option>
                    </select>
                    학교
                </th>
                <th>
                    <select id="gradeFilter" onchange="filterMembers()">
                        <option value="">전체</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    학년
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.username}"></td>
                <td th:text="${member.displayName}" class="bold-text"></td>
                <td th:text="${member.schoolName}" class="bold-text"></td>
                <td th:text="${member.grade}" class="bold-text"></td>
                <td>
                    <a th:href="@{/admin/score/image(username=${member.username})}" class="btn btn-primary"><i class="fas fa-chart-line"></i></a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script>
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData(this);

        fetch('/admin/score/upload', {
            method: 'POST',
            body: formData
        })
        .then(response => response.text())
        .then(data => {
            alert(data);
            window.location.reload(); // 페이지 새로고침
        })
        .catch(error => {
            alert('파일 업로드 중 오류가 발생했습니다.');
        });
    });

    function filterMembers() {
    const gradeFilter = document.getElementById("gradeFilter").value;
    const schoolFilter = document.getElementById("schoolFilter").value;
    const rows = document.querySelectorAll("table tbody tr");

    rows.forEach((row) => {
        const grade = row.children[3].textContent.trim();
        const school = row.children[2].textContent.trim();

        const gradeMatch = gradeFilter === "" || grade === gradeFilter;
        const schoolMatch = schoolFilter === "" || school === schoolFilter;

        row.style.display = (gradeMatch && schoolMatch) ? "" : "none";
    });
}
</script>
<script>
    const menuToggle = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('.nav-menu');
    const navRight = document.querySelector('.nav-right2');

    menuToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        if (navRight) {
            navRight.classList.toggle('active');
        }
    });
</script>

</body>
</html>
