<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학생별 차트 다운로드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="/css/nav.css" rel="stylesheet">
    <link href="/css/scoreImage.css" rel="stylesheet">

</head>
<style>
    .sidebar {
        width: 250px;
        background-color: #f5f5f5;
        padding: 15px;
        border-right: 1px solid #A5D6A7;
        border-radius: 8px;
        overflow-y: auto;
        position: fixed;
        top: 60px;
        left: 0;
        height: calc(100vh - 60px);
    }

    .content-container {
        display: flex;
        margin-top: 60px;
    }

    .main-content {
        margin-left: 260px; /* Matches sidebar width + spacing */
        padding: 20px;
        flex: 1;
    }

    .list-group {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .list-group-item {
        padding: 12px 20px;
        border: none;
        cursor: pointer;
        color: #333;
        background-color: transparent;
        transition: background-color 0.3s, color 0.3s;
    }

    .list-group-item:hover {
        background-color: #A5D6A7;
        color: #fff;
    }

    .detail-name {
        font-weight: bold;
        font-size: 16px;
    }

    .sub-list {
        margin-top: 10px;
        padding-left: 20px;
    }

    .sub-list .list-group-item {
        padding-left: 30px;
    }

    p {
        color: #333;
        font-size: 14px;
    }
</style>
<style>
    .list-group-item.active {
        background-color: #A5D6A7; /* 클릭된 버튼의 배경색 */
        color: #fff; /* 클릭된 버튼의 텍스트 색상 */
        font-weight: bold; /* 강조 효과 */
    }
</style>
<body>
<div th:replace="~{nav :: navbar}"></div>

<main class="container mt-5">
    <aside class="sidebar">
        <ul class="list-group" id="sidebarMenu">
            <li th:each="detail : ${separatedDetails}" class="list-group-item" data-name="${detail.code}">
                <span class="detail-name" th:text="${detail.name}"></span>

                <ul class="sub-list mt-2" th:if="${sCodeToSMonth[detail.code] != null and not #lists.isEmpty(sCodeToSMonth[detail.code])}">
                    <li th:each="month : ${sCodeToSMonth[detail.code]}"
                        th:attr="onclick=|loadChart('${detail.code}', '${month}')|"
                        th:text="${month} + '월'"
                        class="list-group-item ps-5"></li>
                </ul>

                <p th:if="${sCodeToSMonth[detail.code] == null or #lists.isEmpty(sCodeToSMonth[detail.code])}">
                    성적 정보가 없어요🥹
                </p>
            </li>
        </ul>
    </aside>
    <div class="combined-container text-center">
        <div style="display: flex; align-items: center; gap: 10px;">
            <h3 th:text="${displayName}">학생 개인 성적 차트</h3>
            <h3 id="chartTitle"></h3>
        </div>

        <div class="chart-container">
            <canvas id="scoreChart" width="800" height="500"></canvas>
        </div>

        <button onclick="saveChart()" class="button mt-3">차트 저장</button>

        <input type="hidden" id="username" th:value="${username}">
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const items = document.querySelectorAll(".list-group-item");

            items.forEach(item => {
                const detailName = item.querySelector(".detail-name");
                const subList = item.querySelector(".sub-list");

                if (detailName && subList) {
                    subList.style.display = "none"; // 기본적으로 숨김

                    detailName.addEventListener("click", () => {
                        const isHidden = subList.style.display === "none";
                        subList.style.display = isHidden ? "block" : "none"; // 토글 기능
                    });
                }
            });
        });

        function loadChart(code, month) {
            const username = document.querySelector("#username").value; // Assuming username is stored in a hidden input or element

            fetch(`/admin/score/chart?username=${username}&code=${code}&month=${month}`)
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch chart data");
                    return response.json();
                })
                .then(data => {
                    createChart(data);

                    const chartTitleElement = document.querySelector("#chartTitle");
                    if (chartTitleElement) {
                        chartTitleElement.textContent = `${month}월 성적차트`;
                    }
                })
                .catch(error => console.error("Error fetching chart data:", error));
        }
    </script>
    <script th:inline="javascript">
        const labels = /*[[${labels}]]*/ [];
        const minScores = /*[[${minScores}]]*/ [];
        const avgScores = /*[[${avgScores}]]*/ [];
        const maxScores = /*[[${maxScores}]]*/ [];
        const studentScores = /*[[${studentScores}]]*/ [];
    </script>

    <script th:inline="javascript">
        let chartInstance; // 전역 변수로 차트 인스턴스를 저장

        function createChart(data) {
            // 기존 차트가 있다면 삭제
            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctx = document.getElementById("scoreChart").getContext("2d");
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [
                        {
                            label: '최소 점수',
                            data: data.minScores,
                            backgroundColor: 'rgba(255, 99, 132, 0.5)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 1
                        },
                        {
                            label: '평균 점수',
                            data: data.avgScores,
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        },
                        {
                            label: '최대 점수',
                            data: data.maxScores,
                            backgroundColor: 'rgba(75, 192, 192, 0.5)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        },
                        {
                            label: '내 점수',
                            data: data.studentScores,
                            type: 'line', // 선 그래프
                            fill: false,
                            borderColor: 'rgba(255, 206, 86, 1)',
                            tension: 0.1,
                            borderWidth: 2,
                            pointBackgroundColor: 'rgba(255, 206, 86, 1)',
                            pointRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: Math.max(...data.maxScores) + 2 || 12,
                            ticks: { stepSize: 1 }
                        },
                        x: {
                            title: { display: true, text: '시험 회차' }
                        }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: '성적 분포도' }
                    }
                }
            });
        }

        function saveChart() {
            if (!chartData) {
                alert('차트 데이터가 없습니다.');
                return;
            }

            const month = chartData.month || "Unknown Month";
            const separated = chartData.separated || "Unknown Group";
            const displayName = [[${displayName}]];

            let classText = "";
            switch (separated) {
                case "1-1":
                    classText = "고1 (월수반)";
                    break;
                case "1-2":
                    classText = "고1 (금일반)";
                    break;
                case "2-1":
                    classText = "고2 (화목반)";
                    break;
                case "2-2":
                    classText = "고2 (토요반)";
                    break;
                default:
                    classText = "Unknown Class";
            }

            const fileName = `${classText} ${month}월 ${displayName} 성적 차트.png`;

            const link = document.createElement('a');
            link.download = fileName;
            link.href = document.getElementById('scoreChart').toDataURL('image/png');
            link.click();
        }
    </script>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        const navRight = document.querySelector('.nav-right2');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            if (navRight) {
                navRight.classList.toggle('active');
            }
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const sidebarItems = document.querySelectorAll(".list-group-item");

            sidebarItems.forEach(item => {
                item.addEventListener("click", function () {
                    // 기존 활성화된 항목에서 active 클래스 제거
                    sidebarItems.forEach(el => el.classList.remove("active"));

                    // 현재 클릭된 항목에 active 클래스 추가
                    this.classList.add("active");
                });
            });
        });
    </script>
</main>
</body>
</html>
