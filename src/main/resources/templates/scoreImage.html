<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학생별 차트 다운로드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="/css/nav.css" rel="stylesheet">
    <link href="/css/scoreImage.css" rel="stylesheet">

</head>
<body>
<div th:replace="~{nav :: navbar}"></div>

<main class="container mt-5">
    <div class="combined-container text-center">
        <h1 th:text="${displayName} + '의 성적 차트'"></h1>

        <div class="chart-container">
            <canvas id="scoreChart" width="800" height="500"></canvas>
        </div>

        <button onclick="saveChart()" class="button mt-3">차트 저장</button>
    </div>


    <script th:inline="javascript">
        let chartData = null;
        let chart = null;

        document.addEventListener("DOMContentLoaded", async function() {
            const username = [[${username}]];
            const displayName = [[${displayName}]];
            const ctx = document.getElementById("scoreChart").getContext("2d");

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [
                        { label: '최소 점수', data: [], backgroundColor: 'rgba(255, 99, 132, 0.5)', borderColor: 'rgba(255, 99, 132, 1)', borderWidth: 1 },
                        { label: '평균 점수', data: [], backgroundColor: 'rgba(54, 162, 235, 0.5)', borderColor: 'rgba(54, 162, 235, 1)', borderWidth: 1 },
                        { label: '최대 점수', data: [], backgroundColor: 'rgba(75, 192, 192, 0.5)', borderColor: 'rgba(75, 192, 192, 1)', borderWidth: 1 },
                        { label: '[[${displayName}]]의 점수', data: [], type: 'line', fill: false, borderColor: 'rgba(255, 206, 86, 1)', tension: 0.1, borderWidth: 2, pointBackgroundColor: 'rgba(255, 206, 86, 1)', pointRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 12, ticks: { stepSize: 1 }},
                        x: { title: { display: true, text: '시험 회차' }}
                    },
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: '성적 분포도' }
                    }
                }
            });

            try {
                const response = await fetch(`/admin/score/getStudentScores?username=${username}`);
                if (!response.ok) throw new Error('Network response was not ok');
                chartData = await response.json();

                if (!chartData || Object.keys(chartData).length === 0) {
                    console.error('데이터가 없습니다.');
                    return;
                }

                // Update chart with received data
                chart.data.labels = chartData.labels;
                chart.data.datasets[0].data = chartData.minScores;
                chart.data.datasets[1].data = chartData.avgScores;
                chart.data.datasets[2].data = chartData.maxScores;
                chart.data.datasets[3].data = chartData.studentScores;
                chart.update();
            } catch (error) {
                console.error('데이터를 가져오는 중 오류 발생:', error);
            }
        });

        function saveChart() {
            if (!chartData) {
                alert('차트 데이터가 없습니다.');
                return;
            }

            const month = chartData.month || "Unknown Month";
            const separated = chartData.separated || "Unknown Group";
            const displayName = [[${displayName}]];

            let classText = "";
            switch (separated) {
                case "1-1":
                    classText = "고1 (월수반)";
                    break;
                case "1-2":
                    classText = "고1 (금일반)";
                    break;
                case "2-1":
                    classText = "고2 (화목반)";
                    break;
                case "2-2":
                    classText = "고2 (토요반)";
                    break;
                default:
                    classText = "Unknown Class";
            }

            const fileName = `${classText} ${month}월 ${displayName} 성적 차트.png`;

            const link = document.createElement('a');
            link.download = fileName;
            link.href = document.getElementById('scoreChart').toDataURL('image/png');
            link.click();
        }
    </script>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        const navRight = document.querySelector('.nav-right2');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            if (navRight) {
                navRight.classList.toggle('active');
            }
        });
    </script>
</main>
</body>
</html>
