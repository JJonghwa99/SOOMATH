<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>개인성적 차트</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="/css/nav.css" rel="stylesheet">
</head>
<style>
    .sidebar {
        width: 250px;
        background-color: #f5f5f5;
        padding: 15px;
        border-right: 1px solid #A5D6A7;
        border-radius: 8px;
        overflow-y: auto;
        position: fixed;
        top: 60px;
        left: 0;
        height: calc(100vh - 60px);
    }

    .content-container {
        display: flex;
        margin-top: 60px;
    }

    .main-content {
        margin-left: 260px; /* Matches sidebar width + spacing */
        padding: 20px;
        flex: 1;
    }

    .list-group {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .list-group-item {
        padding: 12px 20px;
        border: none;
        cursor: pointer;
        color: #333;
        background-color: transparent;
        transition: background-color 0.3s, color 0.3s;
    }

    .list-group-item:hover {
        background-color: #A5D6A7;
        color: #fff;
    }

    .detail-name {
        font-weight: bold;
        font-size: 16px;
    }

    .sub-list {
        margin-top: 10px;
        padding-left: 20px;
    }

    .sub-list .list-group-item {
        padding-left: 30px;
    }

    p {
        color: #333;
        font-size: 14px;
    }
</style>
<style>
    .list-group-item.active {
        background-color: #A5D6A7; /* 클릭된 버튼의 배경색 */
        color: #fff; /* 클릭된 버튼의 텍스트 색상 */
        font-weight: bold; /* 강조 효과 */
    }
</style>

<body>
<div th:replace="~{nav :: navbar}"></div>
<main class="container mt-5">
    <aside class="sidebar">
        <ul class="list-group" id="sidebarMenu">
            <li th:each="detail : ${separatedDetails}" class="list-group-item" data-name="${detail.code}">
                <span class="detail-name" th:text="${detail.name}"></span>

                <ul class="sub-list mt-2" th:if="${sCodeToSMonth[detail.code] != null and not #lists.isEmpty(sCodeToSMonth[detail.code])}">
                    <li th:each="month : ${sCodeToSMonth[detail.code]}"
                        th:attr="onclick=|loadChart('${detail.code}', '${month}')|"
                        th:text="${month} + '월'"
                        class="list-group-item ps-5"></li>
                </ul>

                <p th:if="${sCodeToSMonth[detail.code] == null or #lists.isEmpty(sCodeToSMonth[detail.code])}">
                    성적 정보가 없어요🥹
                </p>
            </li>
        </ul>
    </aside>

    <div class="main-content">
        <div style="display: flex; align-items: center; gap: 10px;">
            <h3 th:text="${displayName}">학생 개인 성적 차트</h3>
            <h3 id="chartTitle"></h3>
        </div>
        <canvas id="scoreChart" width="400" height="200"></canvas>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const items = document.querySelectorAll(".list-group-item");

            items.forEach(item => {
                const detailName = item.querySelector(".detail-name");
                const subList = item.querySelector(".sub-list");

                if (detailName && subList) {
                    subList.style.display = "none"; // 기본적으로 숨김

                    detailName.addEventListener("click", () => {
                        const isHidden = subList.style.display === "none";
                        subList.style.display = isHidden ? "block" : "none"; // 토글 기능
                    });
                }
            });
        });

        function loadChart(code, month) {
            fetch(`/score/chart?code=${code}&month=${month}`)
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch chart data");
                    return response.json();
                })
                .then(data => {
                    // 차트 생성
                    createChart(data);

                    // 제목 업데이트
                    const chartTitleElement = document.querySelector("#chartTitle"); // <h3> 요소 선택
                    if (chartTitleElement) {
                        chartTitleElement.textContent = `${month}월 성적차트`; // 제목 업데이트
                    } else {
                        console.error("Chart title element not found.");
                    }
                })
                .catch(error => {
                    console.error("Error fetching chart data:", error);
                });
        }

    </script>
    <script>
        const displayName = /*[[${displayName}]]*/ ''; // 서버에서 전달된 사용자 이름
    </script>


    <script th:inline="javascript">
        const labels = /*[[${labels}]]*/ [];
        const minScores = /*[[${minScores}]]*/ [];
        const avgScores = /*[[${avgScores}]]*/ [];
        const maxScores = /*[[${maxScores}]]*/ [];
        const studentScores = /*[[${studentScores}]]*/ [];
    </script>

<script>
    let chartInstance; // 전역 변수로 차트 인스턴스를 저장

    function createChart(data) {
    // 기존 차트가 있다면 삭제
    if (chartInstance) {
    chartInstance.destroy();
    }

    const ctx = document.getElementById("scoreChart").getContext("2d");
    chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
    labels: data.labels,
    datasets: [
    {
    label: '최소 점수',
    data: data.minScores,
    backgroundColor: 'rgba(255, 99, 132, 0.5)',
    borderColor: 'rgba(255, 99, 132, 1)',
    borderWidth: 1
    },
    {
    label: '평균 점수',
    data: data.avgScores,
    backgroundColor: 'rgba(54, 162, 235, 0.5)',
    borderColor: 'rgba(54, 162, 235, 1)',
    borderWidth: 1
    },
    {
    label: '최대 점수',
    data: data.maxScores,
    backgroundColor: 'rgba(75, 192, 192, 0.5)',
    borderColor: 'rgba(75, 192, 192, 1)',
    borderWidth: 1
    },
    {
    label: '내 점수',
    data: data.studentScores,
    type: 'line', // 선 그래프
    fill: false,
    borderColor: 'rgba(255, 206, 86, 1)',
    tension: 0.1,
    borderWidth: 2,
    pointBackgroundColor: 'rgba(255, 206, 86, 1)',
    pointRadius: 4
    }
    ]
    },
    options: {
    responsive: true,
    scales: {
    y: {
    beginAtZero: true,
    max: Math.max(...data.maxScores) + 2 || 12,
    ticks: { stepSize: 1 }
    },
    x: {
    title: { display: true, text: '시험 회차' }
    }
    },
    plugins: {
    legend: { position: 'top' },
    title: { display: true, text: '성적 분포도' }
    }
    }
    });
    }
</script>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        const navRight = document.querySelector('.nav-right');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            if (navRight) {
                navRight.classList.toggle('active');
            }
        });
    </script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
    const sidebarItems = document.querySelectorAll(".list-group-item");

    sidebarItems.forEach(item => {
    item.addEventListener("click", function () {
    // 기존 활성화된 항목에서 active 클래스 제거
    sidebarItems.forEach(el => el.classList.remove("active"));

    // 현재 클릭된 항목에 active 클래스 추가
    this.classList.add("active");
    });
    });
    });
    </script>
</main>
</body>
</html>
