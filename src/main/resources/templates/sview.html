<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>개인성적 차트</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
    <link href="/css/nav.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{nav :: navbar}"></div>
<main class="container mt-5">
    <h3 th:text="${displayName} + '의 점수 차트'">학생 개인 성적 차트</h3>
    <canvas id="scoreChart" width="400" height="200"></canvas>

    <script th:inline="javascript">
        const labels = /*[[${labels}]]*/ [];
        const minScores = /*[[${minScores}]]*/ [];
        const avgScores = /*[[${avgScores}]]*/ [];
        const maxScores = /*[[${maxScores}]]*/ [];
        const studentScores = /*[[${studentScores}]]*/ [];

        document.addEventListener("DOMContentLoaded", () => {
            const ctx = document.getElementById("scoreChart").getContext("2d");
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '최소 점수',
                            data: minScores,
                            backgroundColor: 'rgba(255, 99, 132, 0.5)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 1
                        },
                        {
                            label: '평균 점수',
                            data: avgScores,
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        },
                        {
                            label: '최대 점수',
                            data: maxScores,
                            backgroundColor: 'rgba(75, 192, 192, 0.5)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        },
                        {
                            label: '내 점수',
                            data: studentScores,
                            type: 'line',
                            fill: false,
                            borderColor: 'rgba(255, 206, 86, 1)',
                            tension: 0.1,
                            borderWidth: 2,
                            pointBackgroundColor: 'rgba(255, 206, 86, 1)',
                            pointRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 12,
                            ticks: {
                                stepSize: 1
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '시험 회차'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: '성적 분포도'
                        }
                    }
                }
            });
        });
    </script>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        const navRight = document.querySelector('.nav-right');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            if (navRight) {
                navRight.classList.toggle('active');
            }
        });
    </script>
</main>
</body>
</html>
