<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>개인성적 차트</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/green_8logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/green_8logo.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="/css/nav.css" rel="stylesheet">
</head>
<style>
    .sidebar {
        width: 250px;
        background-color: #f5f5f5;
        padding: 15px;
        border-right: 1px solid #A5D6A7;
        border-radius: 8px;
        overflow-y: auto;
        position: fixed;
        top: 60px;
        left: 0;
        height: calc(100vh - 60px);
    }

    .content-container {
        display: flex;
        margin-top: 60px;
    }

    .main-content {
        margin-left: 260px; /* Matches sidebar width + spacing */
        padding: 20px;
        flex: 1;
    }

    .list-group {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .list-group-item {
        padding: 12px 20px;
        border: none;
        cursor: pointer;
        color: #333;
        background-color: transparent;
        transition: background-color 0.3s, color 0.3s;
    }

    .list-group-item:hover {
        background-color: #A5D6A7;
        color: #fff;
    }

    .detail-name {
        font-weight: bold;
        font-size: 16px;
    }

    .sub-list {
        margin-top: 10px;
        padding-left: 20px;
    }

    .sub-list .list-group-item {
        padding-left: 30px;
    }

    p {
        color: #333;
        font-size: 14px;
    }
</style>

<body>
<div th:replace="~{nav :: navbar}"></div>
<main class="container mt-5">
    <aside class="sidebar">
        <ul class="list-group" id="sidebarMenu">
            <li th:each="detail : ${separatedDetails}" class="list-group-item" data-name="${detail.code}">
                <span class="detail-name" th:text="${detail.name}"></span>

                <ul class="sub-list mt-2" th:if="${sCodeToSMonth[detail.code] != null and not #lists.isEmpty(sCodeToSMonth[detail.code])}">
                    <li th:each="month : ${sCodeToSMonth[detail.code]}" th:text="${month}+'월'" class="list-group-item ps-5"></li>
                </ul>

                <p th:if="${sCodeToSMonth[detail.code] == null or #lists.isEmpty(sCodeToSMonth[detail.code])}">
                    업데이트 된 성적 정보가 없어요🥹
                </p>
            </li>
        </ul>
    </aside>

    <div class="main-content">
        <h3 th:text="${displayName} + '의'+'점수 차트'">학생 개인 성적 차트</h3>
        <canvas id="scoreChart" width="400" height="200"></canvas>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const items = document.querySelectorAll(".list-group-item");

            items.forEach(item => {
                const detailName = item.querySelector(".detail-name");
                const subList = item.querySelector(".sub-list");

                if (detailName && subList) {
                    subList.style.display = "none"; // 기본적으로 숨김

                    detailName.addEventListener("click", () => {
                        const isHidden = subList.style.display === "none";
                        subList.style.display = isHidden ? "block" : "none"; // 토글 기능
                    });
                }
            });
        });

    </script>

    <script th:inline="javascript">
        const labels = /*[[${labels}]]*/ [];
        const minScores = /*[[${minScores}]]*/ [];
        const avgScores = /*[[${avgScores}]]*/ [];
        const maxScores = /*[[${maxScores}]]*/ [];
        const studentScores = /*[[${studentScores}]]*/ [];

        document.addEventListener("DOMContentLoaded", () => {
            const ctx = document.getElementById("scoreChart").getContext("2d");
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '최소 점수',
                            data: minScores,
                            backgroundColor: 'rgba(255, 99, 132, 0.5)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 1
                        },
                        {
                            label: '평균 점수',
                            data: avgScores,
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        },
                        {
                            label: '최대 점수',
                            data: maxScores,
                            backgroundColor: 'rgba(75, 192, 192, 0.5)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        },
                        {
                            label: '내 점수',
                            data: studentScores,
                            type: 'line',
                            fill: false,
                            borderColor: 'rgba(255, 206, 86, 1)',
                            tension: 0.1,
                            borderWidth: 2,
                            pointBackgroundColor: 'rgba(255, 206, 86, 1)',
                            pointRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 12,
                            ticks: {
                                stepSize: 1
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '시험 회차'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: '성적 분포도'
                        }
                    }
                }
            });
        });
    </script>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        const navRight = document.querySelector('.nav-right');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            if (navRight) {
                navRight.classList.toggle('active');
            }
        });
    </script>
</main>
</body>
</html>
